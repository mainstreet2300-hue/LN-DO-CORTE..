<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#02050a"><title>LN DO CORTE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}html{background:#000}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}.app{max-width:480px;margin:auto;min-height:100vh;padding-bottom:80px;position:relative;background:#000 url('fundo_ln_do_corte_v15.png') center top / 100% auto no-repeat}.app:before{content:'';position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;background:rgba(0,0,0,.04);z-index:0}.app>*{position:relative;z-index:1}.hero{background:transparent;border-bottom:0;overflow:hidden;height:180px}.heroImg{display:none}.heroText{display:none}.logo{font-size:29px;font-weight:900}.blue{color:#168cff}.muted{color:#91a8bb}main{padding:15px}.card{background:rgba(5,16,26,.70);border:1px solid #174b75;border-radius:18px;padding:17px;margin-bottom:14px;box-shadow:0 10px 30px #0007}h2,h3{margin:0 0 10px}.price{font-size:34px;font-weight:900;color:#168cff;margin:8px 0 15px}button{width:100%;padding:13px;border:0;border-radius:11px;background:#168cff;color:#fff;font-weight:800;font-size:15px;margin-top:8px}button.secondary{background:#10283c;border:1px solid #2a5e88}button.danger{background:#6d1c1c}.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pay button{margin:0;background:#0d2132;border:1px solid #2a5e88}.pay button.selected{background:#168cff}input{width:100%;padding:12px;margin:6px 0;background:#04080d;color:#fff;border:1px solid #31546f;border-radius:9px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #1c3345}.row:last-child{border-bottom:0}.row button{width:auto;padding:8px 11px;margin:0}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#0b3559;color:#72bdff;font-size:12px}.notice{padding:12px;border-radius:10px;background:#092d1b;color:#a3edb7;margin-top:10px}.warn{background:#34260a;color:#ffd978}.notif{background:#071c2d;border:1px solid #168cff;padding:12px;border-radius:10px;margin:8px 0}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:80px;display:flex;background:#02050af5;border-top:1px solid #174b75;z-index:10}nav button{margin:0;border-radius:0;background:transparent;color:#8197aa;font-size:11px;padding:8px 2px}nav button.active{color:#168cff}.small{font-size:12px}.empty{text-align:center;color:#8197aa;padding:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{font-size:12px;padding:6px 8px;border-radius:20px;background:#183b27;color:#9be6ad}.status.off{background:#3a1d1d;color:#ffb0b0}.hidden{display:none}
.instagramCard{text-align:center}.instagramLink{display:block;color:#fff;text-decoration:none;background:#168cff;padding:14px;border-radius:12px;font-weight:900}.instagramLink span{font-size:12px;font-weight:600;opacity:.9}.instagramLink:active{transform:scale(.99)}</style>
</head>
<body><div class="app">
<section class="hero" aria-label="LN DO CORTE"></section>
<main id="main"></main>
<nav><button id="home" onclick="home()">🏠<br>Início</button><button id="book" onclick="booking()">📅<br>Agendar</button><button id="agenda" onclick="agenda()">📋<br>Agenda</button><button id="fin" onclick="finance()">💰<br>Financeiro</button><button id="owner" onclick="owner()">🔐<br>Dono</button></nav>
</div>
<script>
const localGet=(k,d)=>{try{const x=localStorage.getItem(k);return x===null?d:JSON.parse(x)}catch(e){return d}};
const localSet=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const money=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');
let online=false, sb=null, session=null, selectedPay=null;
const cfg=window.LN_CONFIG||{};
if(cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY&&!cfg.SUPABASE_URL.includes('SEU-PROJETO')){try{sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);online=true;}catch(e){online=false;}}
function nav(id){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function dateBR(d){return String(d||'').split('-').reverse().join('/')}
function siteStatus(){return online?'<span class="status">● Online</span>':'<span class="status off">● Modo local</span>'}
async function getSettings(){if(!online)return {price:Number(localGet('price',10)),instagram:localGet('instagram',''),owner_phones:localGet('ownerPhones',[]),finance_reset_at:localGet('financeResetAt',null)};const {data}=await sb.from('settings').select('*').eq('id',1).maybeSingle();return data||{id:1,price:10,instagram:'',owner_phones:[],finance_reset_at:null}}
async function getAppointments(){if(!online)return localGet('appointments',[]);if(!session){return []}const {data,error}=await sb.from('appointments').select('*').order('date',{ascending:true}).order('time',{ascending:true});if(error)throw error;return data||[]}
async function home(){nav('home');const s=await getSettings();const ig=s.instagram?`<div class="card instagramCard"><h3>📸 Instagram da barbearia</h3><p class="muted small">Siga a LN DO CORTE no Instagram</p><a class="instagramLink" href="${esc(s.instagram)}" target="_blank" rel="noopener noreferrer">${esc(s.instagram.replace(/^https?:\/\/(www\.)?/i,''))}<br><span>Toque aqui para abrir o Instagram ↗</span></a></div>`:'';main.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span class="badge">BARBEARIA • LUAN</span>${siteStatus()}</div><h2 style="margin-top:12px">Seu corte, seu estilo.</h2><p class="muted">Agende seu horário de onde estiver.</p><div class="price">${money(s.price)}</div><button onclick="booking()">📅 Agendar agora</button></div>${ig}<div class="card"><h3>✂️ Serviço</h3><div class="row"><span>Corte</span><b>${money(s.price)}</b></div></div><div class="card"><h3>📱 Agendamento online</h3><p class="muted">Escolha dia, hora e forma de pagamento.</p><button onclick="booking()">Marcar meu horário</button></div>`}
function booking(){nav('book');selectedPay=null;main.innerHTML=`<div class="card"><span class="badge">AGENDAMENTO</span><h2 style="margin-top:12px">📅 Marque seu horário</h2><input id="bName" placeholder="Seu nome"><input id="bPhone" placeholder="Seu telefone (opcional)"><input id="bDate" type="date"><input id="bTime" type="time"><h3 style="margin-top:12px">💳 Forma de pagamento</h3><div class="pay"><button id="payPix" onclick="choosePay('Pix')">Pix</button><button id="payCard" onclick="choosePay('Cartão')">Cartão</button><button id="payCash" onclick="choosePay('Dinheiro')">Dinheiro</button></div><p id="payText" class="muted small">Escolha uma opção.</p><button onclick="confirmBooking()">Confirmar agendamento</button></div>`}
function choosePay(v){selectedPay=v;document.querySelectorAll('.pay button').forEach(x=>x.classList.remove('selected'));document.getElementById(v==='Pix'?'payPix':v==='Cartão'?'payCard':'payCash').classList.add('selected');document.getElementById('payText').textContent='Pagamento: '+v}
async function confirmBooking(){const n=document.getElementById('bName').value.trim(),p=document.getElementById('bPhone').value.trim(),d=document.getElementById('bDate').value,t=document.getElementById('bTime').value;if(!n||!d||!t)return alert('Preencha nome, data e horário.');if(!selectedPay)return alert('Escolha a forma de pagamento.');try{if(!online){const existing=await getAppointments();if(existing.some(x=>x.date===d&&x.time===t&&x.status!=='done'&&x.status!=='cancelled'))return alert('Esse horário já está ocupado.');}const item={name:n,phone:p||null,date:d,time:t,payment:selectedPay,status:'scheduled'};if(online){const {error}=await sb.from('appointments').insert(item);if(error){if(error.code==='23505')return alert('Esse horário já está ocupado. Escolha outro.');throw error}}else{const a=localGet('appointments',[]);a.push({...item,id:Date.now()});localSet('appointments',a);const ns=localGet('notifications',[]);ns.push({id:Date.now(),title:'Novo agendamento!',text:`${n} agendou um horário para ${dateBR(d)} às ${t}. Forma de pagamento: ${selectedPay}.`,read:false});localSet('notifications',ns)}alert('Agendamento confirmado! 💈');home()}catch(e){console.error(e);alert('Não foi possível confirmar agora. Verifique a conexão e tente novamente.')}}
async function agenda(){nav('agenda');try{const a=(await getAppointments()).filter(x=>x.status!=='done'&&x.status!=='cancelled');main.innerHTML=`<div class="card"><h2>📋 Agenda do Luan</h2>${a.length?a.map(x=>`<div class="row"><span><b>${esc(x.name)}</b><br><span class="muted">${dateBR(x.date)} • ${x.time}<br>Pagamento: ${esc(x.payment)}${x.phone?' • '+esc(x.phone):''}</span></span><button onclick="finish('${x.id}')">✓</button></div>`).join(''):'<div class="empty">Nenhum agendamento.</div>'}</div>`}catch(e){main.innerHTML='<div class="card"><p>Faça login como dono para abrir a agenda online.</p></div>'}}
async function finish(id){try{if(online){const {error}=await sb.from('appointments').update({status:'done',completed_at:new Date().toISOString()}).eq('id',id);if(error)throw error}else{const a=localGet('appointments',[]),x=a.find(z=>String(z.id)===String(id));if(x)x.status='done';localSet('appointments',a);localSet('done',localGet('done',0)+1)}agenda()}catch(e){alert('Não foi possível atualizar.')}}
async function finance(){nav('fin');let d=0,total=0;try{const a=await getAppointments();const s=await getSettings();const resetAt=s.finance_reset_at||null;const done=a.filter(x=>x.status==='done'&&(!resetAt||!x.completed_at||new Date(x.completed_at)>=new Date(resetAt)));d=done.length;total=d*Number(s.price||0)}catch(e){d=localGet('done',0);const s=await getSettings();total=d*Number(s.price||0)}main.innerHTML=`<div class="card"><h2>💰 Financeiro</h2><div class="price">${money(total)}</div><p class="muted">${d} corte(s) concluído(s) desde o último reset.</p></div>`}
async function owner(){nav('owner');if(online){const {data}=await sb.auth.getSession();session=data.session||null;if(!session){main.innerHTML=`<div class="card"><h2>🔐 Área do dono</h2><p class="muted">Entre com o e-mail e senha cadastrados no Supabase Auth.</p><input id="email" type="email" placeholder="Seu e-mail"><input id="pass" type="password" placeholder="Sua senha"><button onclick="ownerLogin()">Entrar</button></div>`;return}ownerPanel()}else{const has=!!localGet('ownerPass',null);main.innerHTML=`<div class="card"><h2>🔐 Área do dono</h2><p class="muted">${has?'Digite sua senha.':'Crie sua senha de dono.'}</p><input id="ownerPassInput" type="password" placeholder="Senha (mín. 4 caracteres)"><button onclick="ownerLoginLocal()">Entrar</button></div>`}}
async function ownerLogin(){const email=document.getElementById('email').value.trim(),pass=document.getElementById('pass').value;if(!email||!pass)return alert('Preencha e-mail e senha.');const {error}=await sb.auth.signInWithPassword({email,password:pass});if(error)return alert('Login não autorizado.');ownerPanel()}
function ownerLoginLocal(){const p=document.getElementById('ownerPassInput').value,s=localGet('ownerPass',null);if(p.length<4)return alert('A senha precisa ter pelo menos 4 caracteres.');if(s&&p!==s)return alert('Senha incorreta.');if(!s)localSet('ownerPass',p);ownerPanel()}
async function ownerPanel(){const s=await getSettings();let ns=[];if(online){const {data}=await sb.from('notifications').select('*').eq('read',false).order('created_at',{ascending:false});ns=data||[]}else ns=localGet('notifications',[]).filter(x=>!x.read);const phones=s.owner_phones||[];main.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span class="badge">PAINEL DO DONO</span>${siteStatus()}</div><h2 style="margin-top:12px">⚙️ Configurações</h2><p class="muted">Preço atual: ${money(s.price)}</p><input id="newPrice" type="number" step="0.01" value="${s.price}"><button onclick="savePrice()">Salvar preço</button><h3 style="margin-top:18px">📸 Instagram da barbearia</h3><input id="instagramInput" placeholder="https://instagram.com/sua_barbearia" value="${s.instagram||''}"><button onclick="saveInstagram()">Salvar Instagram</button><p class="muted small">Depois de salvar, o Instagram aparece automaticamente na página Início para os clientes.</p></div><div class="card"><h3>📱 Número(s) para notificações</h3><p class="muted small">Cadastre até 3 números no formato internacional, por exemplo +5522999999999.</p><input id="phone1" placeholder="+5522999999999" value="${phones[0]||''}"><input id="phone2" placeholder="+5522999999999" value="${phones[1]||''}"><input id="phone3" placeholder="+5522999999999" value="${phones[2]||''}"><button onclick="savePhones()">Salvar números</button><div class="notice">📲 Com o V8 online, esses números podem ser usados pelo backend para envio real via provedor de mensagens. As chaves do provedor ficam no servidor, nunca no navegador.</div></div><div class="card"><h3>🔔 Novos agendamentos (${ns.length})</h3>${ns.length?ns.map(x=>`<div class="notif"><b>${esc(x.title||'Novo agendamento')}</b><br><span class="muted">${esc(x.text||'')}</span></div>`).join(''):'<p class="muted">Nenhum novo agendamento.</p>'}<button class="secondary" onclick="markRead()">Marcar como lidas</button></div><div class="card"><h3>🔗 Link do site</h3><p class="muted small">Depois de publicar em HTTPS, copie o endereço daqui para a bio do Instagram.</p><input id="siteUrl" value="${location.protocol.startsWith('http')?location.href.split('#')[0]:''}" placeholder="https://..."><button onclick="copySiteLink()">📋 Copiar link</button></div><div class="card"><h3>💰 Controle do financeiro</h3><p class="muted small">Zera somente o acumulado mostrado no Financeiro. Os agendamentos continuam salvos na Agenda.</p><button class="danger" onclick="resetFinance()">🗑️ Resetar financeiro para R$ 0,00</button></div><div class="card"><button class="secondary" onclick="requestPush()">🔔 Ativar notificações deste celular</button>${online?'<button class="danger" onclick="logout()">Sair da conta</button>':''}</div>`}
async function savePrice(){const v=Number(document.getElementById('newPrice').value);if(v<=0)return alert('Preço inválido.');if(online){const {error}=await sb.from('settings').upsert({id:1,price:v});if(error)return alert('Erro ao salvar preço.')}else localSet('price',v);alert('Preço atualizado!');ownerPanel()}
async function saveInstagram(){let u=document.getElementById('instagramInput').value.trim();if(u&&!/^https?:\/\//i.test(u))u='https://instagram.com/'+u.replace(/^@/,'');if(online){const {error}=await sb.from('settings').upsert({id:1,instagram:u});if(error)return alert('Erro ao salvar Instagram.')}else localSet('instagram',u);alert('Instagram salvo!');home()}
async function savePhones(){const phones=[document.getElementById('phone1').value.trim(),document.getElementById('phone2').value.trim(),document.getElementById('phone3').value.trim()].filter(Boolean);if(online){const {error}=await sb.from('settings').upsert({id:1,owner_phones:phones});if(error)return alert('Erro ao salvar números.')}else localSet('ownerPhones',phones);alert('Números salvos!');ownerPanel()}
async function resetFinance(){if(!confirm('Tem certeza que deseja zerar o financeiro? Os agendamentos não serão apagados.'))return;try{const now=new Date().toISOString();if(online){const {error}=await sb.from('settings').upsert({id:1,finance_reset_at:now});if(error)throw error}else{localSet('financeResetAt',now);localSet('done',0)}alert('Financeiro resetado para R$ 0,00!');ownerPanel()}catch(e){console.error(e);alert('Não foi possível resetar o financeiro.')}}
async function markRead(){if(online){await sb.from('notifications').update({read:true}).eq('read',false)}else{const n=localGet('notifications',[]);n.forEach(x=>x.read=true);localSet('notifications',n)}ownerPanel()}
function copySiteLink(){const v=document.getElementById('siteUrl').value.trim();if(!v)return alert('Primeiro publique o site e coloque o link público aqui.');navigator.clipboard?.writeText(v).then(()=>alert('Link copiado!')).catch(()=>alert('Selecione e copie o link.'))}
function openInstagram(encoded){const u=decodeURIComponent(encoded);location.href=u}
async function logout(){await sb.auth.signOut();session=null;owner()}
async function requestPush(){if(!('Notification'in window))return alert('Este navegador não oferece notificações.');if(!location.protocol.startsWith('http'))return alert('Notificações web precisam de HTTPS quando o site estiver publicado.');const r=await Notification.requestPermission();alert(r==='granted'?'Permissão concedida neste celular.':'Permissão não concedida.')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
if(online){sb.auth.onAuthStateChange((_event,s)=>{session=s})}
home();
</script></body></html>
